<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up</title>
        <style>
            body{
                background-color: #8096d2;
                padding-left: 40%;
            }
            h1{
                text-align: center;
            }
           
            .sign-up{
                background-color: white;
                width: 300px;
                padding: 20px;
                border: 3px solid #ccc;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
                color: #0c3197;
                border-color: #0c3197;
            }
            input[type="text"],
            input[type="text"],
            input[type="Email"],
            input[type="Password"],
            input[type="Confirm Password"]{
                width: 100%;
                padding: 10px 0px 10px;
                margin-bottom: 20px;
                border: 2px solid #ccc;
                border-radius: 5px;
                border-color: #0c3197;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            }
            input[type="button"]{
                width: 100%;
                padding: 10px;
                background-color: #0c3197;
                color: #fff;
                margin-top: 20px;
                border: none;
                border-radius: 5px; 
                cursor: pointer;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
                
            }
            input[type="button"]:hover {
                background-color: rgb(37, 50, 161);
                
            }
            

            
        </style>
    </head>
    <body>
        <div class="box">
        <form class="sign-up">
        <h1>Sign Up</h1>
        <label for="fname"> <b>First Name:</b></label> <br> <br>
        <input type="text" id="fname" placeholder="Enter your first Name"><br>
        <label for="lname"> <b>Last Name:</b></label> <br> <br>
        <input type="text" id="lname" placeholder="Enter your last Name"><br>
        <label for="mail"> <b>Email:</b></label> <br> <br>
        <input type="email" id="mail" placeholder="Enter your email address"><br>
        <label for="pass"> <b>Password:</b></label> <br> <br>
        <input type="password" id="pass" placeholder="Enter your password"><br>
        <label for="cpass"> <b>Confirm Password:</b></label> <br> <br>
        <input type="Password" id="cpass" placeholder="Confirm your Password"><br>
        <input type="checkbox"> <b>Accept terms and condition</b> <br> <br>
        <input type="button" value="submit">
        <a href="signin.html">Already have an account</a>
        </form>
    </div>
    </body>
</html>
